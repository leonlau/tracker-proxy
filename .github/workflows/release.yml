name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            target: linux-arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            target: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/tracker-proxy-${{ matrix.target }}${{ matrix.ext }}" .

      - name: Checksum
        run: |
          cd dist
          sha256sum "tracker-proxy-${{ matrix.target }}${{ matrix.ext }}" \
            > "tracker-proxy-${{ matrix.target }}${{ matrix.ext }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tracker-proxy-${{ matrix.target }}
          path: |
            dist/tracker-proxy-${{ matrix.target }}${{ matrix.ext }}
            dist/tracker-proxy-${{ matrix.target }}${{ matrix.ext }}.sha256

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*